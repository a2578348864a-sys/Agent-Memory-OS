name: Windows CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  verify:
    name: Windows PowerShell verification
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Environment info
        shell: powershell
        run: |
          Write-Host "PowerShell: $($PSVersionTable.PSVersion)"
          Write-Host "OS: $([System.Environment]::OSVersion.VersionString)"
          Write-Host "Runner: $env:RUNNER_OS / $env:RUNNER_ARCH"
          Write-Host "Commit: $env:GITHUB_SHA"

      # NOTE: run blocks stay pure ASCII on purpose. The suites live under
      # Chinese-named directories; paths are resolved at runtime via ASCII
      # filters so Windows PowerShell never has to decode non-ASCII literals.
      - name: Lease Core regression (DualAgentWriteLeaseCore.Tests.ps1)
        shell: powershell
        run: |
          $target = Get-ChildItem -Path $env:GITHUB_WORKSPACE -Recurse -File -Filter "DualAgentWriteLeaseCore.Tests.ps1" | Select-Object -First 1
          if ($null -eq $target) { Write-Host "suite not found"; exit 1 }
          powershell -NoProfile -ExecutionPolicy Bypass -File $target.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "Lease Core suite passed (exit 0)"

      - name: Lint validator tests (kb lint suite)
        shell: powershell
        run: |
          $known = @("DualAgentWriteLeaseCore.Tests.ps1", "ResetWrapper.Tests.ps1", "FreshCloneE2E.Tests.ps1")
          $dir = Get-ChildItem -Path $env:GITHUB_WORKSPACE -Directory | Where-Object { $_.Name -like "06_*" } | Select-Object -First 1
          if ($null -eq $dir) { Write-Host "test dir not found"; exit 1 }
          $candidates = @(Get-ChildItem -Path $dir.FullName -File -Filter "*.Tests.ps1")
          $target = $candidates | Where-Object { $known -notcontains $_.Name } | Select-Object -First 1
          if ($null -eq $target) { Write-Host "lint suite not found"; exit 1 }
          powershell -NoProfile -ExecutionPolicy Bypass -File $target.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "Lint validator suite passed (exit 0)"

      - name: Reset wrapper tests (ResetWrapper.Tests.ps1)
        shell: powershell
        run: |
          $target = Get-ChildItem -Path $env:GITHUB_WORKSPACE -Recurse -File -Filter "ResetWrapper.Tests.ps1" | Select-Object -First 1
          if ($null -eq $target) { Write-Host "suite not found"; exit 1 }
          powershell -NoProfile -ExecutionPolicy Bypass -File $target.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "Reset wrapper suite passed (exit 0)"

      - name: Fresh Clone E2E (FreshCloneE2E.Tests.ps1)
        shell: powershell
        run: |
          $target = Get-ChildItem -Path $env:GITHUB_WORKSPACE -Recurse -File -Filter "FreshCloneE2E.Tests.ps1" | Select-Object -First 1
          if ($null -eq $target) { Write-Host "suite not found"; exit 1 }
          powershell -NoProfile -ExecutionPolicy Bypass -File $target.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "Fresh Clone E2E suite passed (exit 0)"

      - name: Repository lint must be clean (issues = 0)
        shell: powershell
        run: |
          $dir = Get-ChildItem -Path $env:GITHUB_WORKSPACE -Directory | Where-Object { $_.Name -like "05_*" } | Select-Object -First 1
          if ($null -eq $dir) { Write-Host "code dir not found"; exit 1 }
          $target = Get-ChildItem -Path $dir.FullName -File | Where-Object { $_.Name -like "*lint*.ps1" } | Select-Object -First 1
          if ($null -eq $target) { Write-Host "lint script not found"; exit 1 }
          $raw = powershell -NoProfile -ExecutionPolicy Bypass -File $target.FullName
          $result = ($raw | Out-String) | ConvertFrom-Json
          if (-not $result.ok -or $result.summary.issues -ne 0) {
            Write-Host ($result | ConvertTo-Json -Depth 10)
            exit 1
          }
          Write-Host "Repository lint clean: issues = $($result.summary.issues)"

      - name: Working tree must stay clean after tests
        shell: powershell
        run: |
          $status = git status --short
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not [string]::IsNullOrWhiteSpace($status)) {
            Write-Host "Working tree is not clean after running the test suites:"
            Write-Host $status
            exit 1
          }
          Write-Host "Working tree clean after tests"
